name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  runners:
    name: pick runners
    # Our self-hosted pools first, GitHub-hosted for the overflow: a job takes our pool only
    # while it has a free slot, else its GitHub image at once (fork pull requests: GitHub only).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      plan: ${{ steps.pick.outputs.plan }}
    steps:
      - id: pick
        uses: Brainwires/.github/actions/pick-runners@415ef1f9941d798b5760bf69f908be88789371a2 # pick-runners
        with:
          jobs: fmt=linux-x64
          vars: ${{ toJSON(vars) }}

  check:
    name: Check
    # Stays on GitHub-hosted: sudo apt-get install (sudo is inert on the self-hosted pool).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config clang libclang-dev
      # Prebuilt V8 (Brainwires/rusty_v8) for the `v8` crate that the page
      # runtime links, verified against scripts/rusty_v8.sha256 and handed to
      # its build script via $GITHUB_ENV. Without it the build fails on
      # purpose (.cargo/config.toml refuses an unverified download). The
      # files go to RUNNER_TEMP so rust-cache does not store them.
      - name: Fetch prebuilt V8
        run: python3 scripts/fetch_rusty_v8.py --dest "$RUNNER_TEMP/rusty_v8" --seed-dir target/debug --github-env
      - name: Check workspace
        run: cargo check --workspace
      - name: Check workspace (test-hooks)
        run: cargo check --workspace --features test-hooks

  clippy:
    name: Clippy
    # Stays on GitHub-hosted: sudo apt-get install (sudo is inert on the self-hosted pool).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config clang libclang-dev
      # Prebuilt V8 (Brainwires/rusty_v8) for the `v8` crate that the page
      # runtime links, verified against scripts/rusty_v8.sha256 and handed to
      # its build script via $GITHUB_ENV. Without it the build fails on
      # purpose (.cargo/config.toml refuses an unverified download). The
      # files go to RUNNER_TEMP so rust-cache does not store them.
      - name: Fetch prebuilt V8
        run: python3 scripts/fetch_rusty_v8.py --dest "$RUNNER_TEMP/rusty_v8" --seed-dir target/debug --github-env
      - name: Clippy workspace
        run: cargo clippy --workspace

  fmt:
    name: Format
    needs: runners
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}').fmt || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all --check

  test:
    name: Test
    # Stays on GitHub-hosted: sudo apt-get install (sudo is inert on the self-hosted pool).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every test binary links V8 statically (the lib's unit tests, the
      # binary and each integration test target): make room first.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config clang libclang-dev
      # Prebuilt V8 (Brainwires/rusty_v8) for the `v8` crate that the page
      # runtime links, verified against scripts/rusty_v8.sha256 and handed to
      # its build script via $GITHUB_ENV. Without it the build fails on
      # purpose (.cargo/config.toml refuses an unverified download). The
      # files go to RUNNER_TEMP so rust-cache does not store them.
      - name: Fetch prebuilt V8
        run: python3 scripts/fetch_rusty_v8.py --dest "$RUNNER_TEMP/rusty_v8" --seed-dir target/debug --github-env
      - name: Build binary for MCP harness tests
        run: cargo build --bin thalora
      - name: Test workspace
        run: cargo test --workspace -- --test-threads=1
        env:
          RUST_MIN_STACK: 16777216
          # Page localStorage of the browsers under test goes to a scratch
          # profile, not the runner's home
          THALORA_PROFILE_DIR: ${{ runner.temp }}/thalora-profile

  doc:
    name: Documentation
    # Stays on GitHub-hosted: sudo apt-get install (sudo is inert on the self-hosted pool).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config clang libclang-dev
      # Prebuilt V8 (Brainwires/rusty_v8) for the `v8` crate that the page
      # runtime links, verified against scripts/rusty_v8.sha256 and handed to
      # its build script via $GITHUB_ENV. Without it the build fails on
      # purpose (.cargo/config.toml refuses an unverified download). The
      # files go to RUNNER_TEMP so rust-cache does not store them.
      - name: Fetch prebuilt V8
        run: python3 scripts/fetch_rusty_v8.py --dest "$RUNNER_TEMP/rusty_v8" --seed-dir target/debug --github-env
      - name: Doc workspace
        run: cargo doc --workspace --no-deps

  page-runtime:
    name: Page runtime (fork)
    # Builds and tests the Brainwires deno fork's `deno_web_page` crate
    # (ext/web_page, the V8 page runtime Thalora links) at the revision in
    # scripts/deno-fork.rev, in the fork's own workspace and toolchain.
    # GitHub-hosted: no fork CI is involved and our pools are not loaded.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Read fork revision
        id: rev
        run: echo "rev=$(tr -d '[:space:]' < scripts/deno-fork.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Brainwires/deno
          ref: ${{ steps.rev.outputs.rev }}
          path: deno-fork
          submodules: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config clang libclang-dev protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deno-fork
          key: page-runtime
      - name: Fetch prebuilt V8 (fork script)
        working-directory: deno-fork
        run: python3 .github/denext-runtime/fetch_rusty_v8.py --target x86_64-unknown-linux-gnu --dest "$RUNNER_TEMP/rusty_v8" --seed-dir target/debug --github-env
      - name: Test deno_web_page
        working-directory: deno-fork
        # The fork's .cargo/config.toml carries its own rustflags; the
        # workflow-level RUSTFLAGS would replace them.
        run: |
          unset RUSTFLAGS
          cargo test -p deno_web_page -- --test-threads=1

  # The "Baselines (reporting)" job that used to run here (page corpus through
  # the MCP binary, `cargo xtask fingerprint-dump` / `fingerprint-diff` and
  # `cargo xtask wpt`, uploaded as the `baselines` artifact) measured the
  # JavaScript engine. It was dropped with Boa. Page JavaScript now runs on V8
  # (the fork's page runtime, linked by the jobs above), so it can return:
  # TODO(a3) re-enable it and re-baseline against V8. The xtask commands and
  # the corpus test (still #[ignore]d) are kept and still build; the
  # `test-hooks` feature they need is covered by the Check job.
