name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  runners:
    name: pick runners
    # Our self-hosted pools first, GitHub-hosted for the overflow: a job takes our pool only
    # while it has a free slot, else its GitHub image at once (fork pull requests: GitHub only).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      plan: ${{ steps.pick.outputs.plan }}
    steps:
      - id: pick
        uses: Brainwires/.github/actions/pick-runners@415ef1f9941d798b5760bf69f908be88789371a2 # pick-runners
        with:
          jobs: fmt=linux-x64
          vars: ${{ toJSON(vars) }}

  check:
    name: Check
    # Stays on GitHub-hosted: sudo apt-get install (sudo is inert on the self-hosted pool).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config clang libclang-dev
      - name: Check workspace
        run: cargo check --workspace
      - name: Check workspace (test-hooks)
        run: cargo check --workspace --features test-hooks

  clippy:
    name: Clippy
    # Stays on GitHub-hosted: sudo apt-get install (sudo is inert on the self-hosted pool).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config clang libclang-dev
      - name: Clippy workspace
        run: cargo clippy --workspace

  fmt:
    name: Format
    needs: runners
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}').fmt || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all --check

  test:
    name: Test
    # Stays on GitHub-hosted: sudo apt-get install (sudo is inert on the self-hosted pool).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config clang libclang-dev
      - name: Build binary for MCP harness tests
        run: cargo build --bin thalora
      - name: Test workspace
        run: cargo test --workspace -- --test-threads=1
        env:
          RUST_MIN_STACK: 16777216

  doc:
    name: Documentation
    # Stays on GitHub-hosted: sudo apt-get install (sudo is inert on the self-hosted pool).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config clang libclang-dev
      - name: Doc workspace
        run: cargo doc --workspace --no-deps

  # The "Baselines (reporting)" job that used to run here (page corpus through
  # the MCP binary, `cargo xtask fingerprint-dump` / `fingerprint-diff` and
  # `cargo xtask wpt`, uploaded as the `baselines` artifact) measured the
  # JavaScript engine. Boa has been removed and V8 is not wired in yet, so
  # there is nothing to measure: the job returns with V8. The xtask commands
  # and the corpus test (now #[ignore]d) are kept and still build; the
  # `test-hooks` feature they need is covered by the Check job.
