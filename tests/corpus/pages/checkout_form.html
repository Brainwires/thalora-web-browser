<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkout</title></head>
<body>
  <h1>Checkout</h1>
  <form id="checkout" action="/echo" method="post">
    <label for="name">Full name</label><input id="name" name="name" autocomplete="name" required>
    <label for="email">Email</label><input id="email" name="email" type="email" required>
    <label for="country">Country</label>
    <select id="country" name="country"><option>Norway</option><option selected>Portugal</option><option>Chile</option></select>
    <fieldset><legend>Shipping</legend>
      <label><input type="radio" name="ship" value="standard" checked> Standard</label>
      <label><input type="radio" name="ship" value="express"> Express</label>
    </fieldset>
    <label><input type="checkbox" name="terms" required> I accept the terms</label>
    <input type="hidden" name="csrf" value="token-123">
    <button type="submit">Place order</button>
  </form>
</body>
</html>
