<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture Login</title></head>
<body>
  <h1>Sign in</h1>
  <form id="login" action="/echo" method="post">
    <input type="hidden" name="csrf" value="fixture-csrf-token">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <input id="remember" name="remember" type="checkbox" value="yes" checked>
    <button id="signin" type="submit" name="action" value="signin">Sign in</button>
  </form>
  <form id="search" action="/echo" method="get">
    <input id="q" name="q" type="search">
    <button id="search-btn">Search</button>
  </form>
</body>
</html>
